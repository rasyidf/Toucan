name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Test platform (all runs the full release matrix)
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - all
      coverage:
        description: Collect and upload code coverage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.platform == 'all' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Toucan.CrossPlatform.slnx --configuration Release
      - name: Test
        if: ${{ !inputs.coverage }}
        run: dotnet test Toucan.CrossPlatform.slnx --configuration Release --no-build --results-directory TestResults --logger trx
      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: dotnet test Toucan.CrossPlatform.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish and verify spelling source and notices
        run: |
          dotnet publish Toucan.Avalonia/Toucan.Avalonia.csproj --configuration Release --no-restore -p:UseAppHost=false -o build/release-gate -m:1
          python tools/Verify-SpellingArtifacts.py --folder build/release-gate --output build/spelling-artifacts.json
      - name: Upload compatibility gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-gate-${{ matrix.os }}
          path: |
            build/spelling-artifacts.json
            TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload coverage
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 3
