name: Publish SDK packages

# Publishes the three plugin SDK packages (Abstractions, Avalonia, Testing) to NuGet.org.
# Their versions track the plugin API and desktop contract, not the app version, so this is a
# separate release from the app: tag an SDK release as `sdk-v<abstractions-version>`
# (e.g. sdk-v1.1.0) or run it manually. Set the NUGET_API_KEY repository secret first.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push to NuGet.org"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack Toucan.Plugins.Abstractions/Toucan.Plugins.Abstractions.csproj -c Release -o artifacts
          dotnet pack Toucan.Plugins.Avalonia/Toucan.Plugins.Avalonia.csproj       -c Release -o artifacts
          dotnet pack Toucan.Plugins.Testing/Toucan.Plugins.Testing.csproj         -c Release -o artifacts

      - name: List packages
        run: ls -l artifacts

      - name: Upload packages as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-nupkgs
          path: artifacts/*.nupkg

      # Pushes on an sdk-v* tag, or on a manual run with dry_run unchecked.
      # --skip-duplicate makes a re-run safe when a version is already published.
      - name: Push to NuGet.org
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set; cannot publish." >&2
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
